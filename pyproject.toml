[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "blueeconomy-data-platform"
version = "0.1.0"
description = "Governed real-input lakehouse ingestion for the Blue Economy Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka==2.15.0",
  "cryptography==43.0.1",
  "deltalake==1.6.2",
  "geolibre-wasm==1.5.2",
  "jsonschema==4.26.0",
  "pyais==3.2.1",
  "pyarrow==25.0.1",
  # Phase-7 OTel wave: OTLP gRPC exporters. Disabled (no-op) unless
  # OTEL_EXPORTER_OTLP_ENDPOINT is set.
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "hatchling==1.28.0",
  "mypy==1.17.1",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "ruff==0.12.11",
  "types-confluent-kafka==1.4.1",
  "types-jsonschema==4.26.0.20260518",
]

[project.scripts]
blueeconomy-ingest-events = "blueeconomy_data_platform.ingest:main"
blueeconomy-ingest-kafka = "blueeconomy_data_platform.kafka_ingest:main"
blueeconomy-ingest-vessels = "blueeconomy_data_platform.vessel_ingest:main"
blueeconomy-gold-assembly = "blueeconomy_data_platform.gold_assembly:main"
blueeconomy-retention-enforce = "blueeconomy_data_platform.retention:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blueeconomy_data_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pyais", "pyais.*", "geolibre_wasm", "geolibre_wasm.*"]
ignore_missing_imports = true
