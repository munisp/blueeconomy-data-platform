[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "blueeconomy-data-platform"
version = "0.1.0"
description = "Governed real-input lakehouse ingestion for the Blue Economy Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "deltalake==1.6.2",
  "jsonschema==4.26.0",
  "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "mypy==1.17.1",
  "pytest==9.0.3",
  "ruff==0.12.11",
  "types-jsonschema==4.26.0.20260518",
]

[project.scripts]
blueeconomy-ingest-events = "blueeconomy_data_platform.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blueeconomy_data_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
